AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Solver Streamlit (ruteo EV) en ECS Fargate, accesible solo por URL secreta
  (token en ?token=). Usa la VPC por defecto, con IP pública directa (sin ALB)
  para minimizar piezas. La imagen debe estar previamente en ECR.

Parameters:
  ImageUri:
    Type: String
    Description: URI de la imagen en ECR (p. ej. 123.dkr.ecr.us-east-1.amazonaws.com/zmd-solver:latest)
  SolverToken:
    Type: String
    NoEcho: true
    Description: Token secreto que debe ir en la URL (?token=...) para acceder.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subred pública (de la VPC por defecto).
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC por defecto.
  BedrockModelId:
    Type: String
    Default: amazon.nova-lite-v1:0

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: zmd-solver-cluster

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/zmd-solver
      RetentionInDays: 7

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permite HTTP al solver Streamlit (8501)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8501
          ToPort: 8501
          CidrIp: 0.0.0.0/0   # publico, pero el contenido exige el token secreto

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: bedrock-invoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:Converse]
                Resource: "*"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: zmd-solver
      Cpu: "1024"
      Memory: "2048"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: solver
          Image: !Ref ImageUri
          PortMappings:
            - ContainerPort: 8501
          Environment:
            - Name: SOLVER_TOKEN
              Value: !Ref SolverToken
            - Name: BEDROCK_MODEL_ID
              Value: !Ref BedrockModelId
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: solver

  Service:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref TaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetId]
          SecurityGroups: [!Ref SecurityGroup]

Outputs:
  Nota:
    Description: Cómo obtener la URL secreta del solver
    Value: !Sub >
      El servicio corre en Fargate con IP publica. Obtén la IP de la tarea en la
      consola ECS (o con 'aws ecs ...') y accede a:
      http://IP_PUBLICA:8501/?token=EL_TOKEN
