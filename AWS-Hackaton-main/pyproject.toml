[project]
name = "ev-routing"
version = "0.1.0"
description = "Planificación de rutas y recargas para vehículos eléctricos"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "pyomo>=6.6",
]

[project.optional-dependencies]
aws = ["boto3>=1.30"]
ui = ["streamlit>=1.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
