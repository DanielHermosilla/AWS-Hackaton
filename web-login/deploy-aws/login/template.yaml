AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Webapp + login de ZMD Mobility (hackaton). Lambda contenerizada (FastAPI vía
  Mangum) que sirve la webapp estática y gestiona cuentas/sesiones en DynamoDB.
  Expuesta públicamente por una HTTP API.

Parameters:
  CookieSecure:
    Type: String
    Default: "1"
    AllowedValues: ["0", "1"]
    Description: 1 = cookie solo HTTPS (producción). 0 = permite HTTP (dev).

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Architectures:
      - x86_64

Resources:
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: zmd_users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: zmd_sessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: token_hash
          AttributeType: S
      KeySchema:
        - AttributeName: token_hash
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Environment:
        Variables:
          DDB_USERS_TABLE: !Ref UsersTable
          DDB_SESSIONS_TABLE: !Ref SessionsTable
          COOKIE_SECURE: !Ref CookieSecure
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: zmd-login

Outputs:
  WebappUrl:
    Description: URL pública de la webapp con login
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
